<!doctype html>
<html lang="zh-CN">

<meta property="og:title" content="清明上河图·汴京漫游">

<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
/* 布局：全屏画卷为底，上下遮幅如银幕；题签、落款、印章沿画心四角排布 */
:root{
  --ink:#1c1410; --ink-soft:#3a2a1e;
  --silk:#d8bd8b; --silk-pale:#efe0bb;
  --cinnabar:#a8382a; --malachite:#5c7c5b; --ochre:#9a6b3c;
  --font-brush:'Ma Shan Zheng','Kaiti SC','STKaiti','KaiTi',serif;
  --font-song:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  --bar:min(8vh,56px);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--silk-pale);font-family:var(--font-song);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.bar{position:fixed;left:0;right:0;height:var(--bar);background:var(--ink);z-index:2;pointer-events:none}
.bar.t{top:0}.bar.b{bottom:0}
.hud{position:fixed;inset:0;z-index:3;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(var(--bar) + 14px + env(safe-area-inset-top,0px)) calc(var(--bar) + 14px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto;gap:12px;
  transition:opacity .8s}
.hud[hidden]{display:none!important}
.sig{grid-area:1/1;display:flex;gap:10px;align-items:flex-start}
.seal{writing-mode:vertical-rl;font-family:var(--font-brush);font-size:17px;line-height:1.15;letter-spacing:.08em;
  color:var(--silk-pale);background:var(--cinnabar);padding:8px 5px;border-radius:3px;
  box-shadow:inset 0 0 0 1.5px rgba(239,224,187,.55)}
.place{writing-mode:vertical-rl;font-family:var(--font-brush);font-size:clamp(20px,2.6vw,30px);letter-spacing:.22em;
  color:var(--ink);text-shadow:0 0 10px rgba(239,224,187,.9),0 0 2px rgba(239,224,187,.9);margin:2px 0 0;
  transition:opacity .9s;min-height:6em}
.ctl{grid-area:1/3;display:flex;gap:8px;align-self:start;flex-wrap:wrap;justify-content:flex-end}
.modes{display:flex;gap:0;pointer-events:auto;align-self:start;
  border:1px solid rgba(28,20,16,.55);border-radius:4px;overflow:hidden;background:rgba(239,224,187,.82)}
.modes button{font:inherit;font-size:14px;letter-spacing:.2em;padding:9px 12px 9px 15px;border:0;background:none;color:var(--ink);cursor:pointer}
.modes button+button{border-left:1px solid rgba(28,20,16,.3)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--silk-pale)}
.modes button:focus-visible,.intro button:focus-visible{outline:2px solid var(--cinnabar);outline-offset:-2px}
.hint{grid-area:3/1/4/4;justify-self:center;margin:0;font-size:13px;letter-spacing:.14em;color:var(--ink);
  background:rgba(239,224,187,.78);padding:6px 14px;border-radius:3px;text-align:center}
.intro{position:fixed;inset:0;z-index:4;display:flex;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(var(--bar) + 16px);
  background:linear-gradient(90deg,rgba(28,20,16,.9) 0%,rgba(28,20,16,.62) 32%,rgba(28,20,16,0) 68%);
  transition:opacity 1s}
.intro.out{opacity:0;pointer-events:none}
.intro-in{display:flex;gap:clamp(18px,4vw,44px);align-items:flex-start;margin-left:clamp(0px,5vw,72px);max-width:100%}
.intro h1{writing-mode:vertical-rl;font-family:var(--font-brush);font-weight:400;font-size:clamp(46px,9.5vh,92px);
  letter-spacing:.12em;line-height:1;margin:0;color:var(--silk-pale);text-shadow:0 2px 18px rgba(0,0,0,.5)}
.intro-side{display:flex;flex-direction:column;gap:16px;min-width:0;max-width:22em;padding-top:6px}
.intro .by{font-size:14px;letter-spacing:.3em;color:var(--silk);margin:0}
.intro .lead{font-size:15px;line-height:1.9;margin:0;color:var(--silk-pale)}
.intro .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.intro button{font:inherit;font-size:15px;letter-spacing:.24em;padding:11px 16px 11px 20px;border-radius:3px;cursor:pointer;
  border:1px solid var(--silk);background:transparent;color:var(--silk-pale)}
.intro button.go{background:var(--cinnabar);border-color:var(--cinnabar)}
.intro button:disabled{opacity:.45;cursor:default}
.intro .load{font-size:13px;letter-spacing:.2em;color:var(--silk);margin:0;min-height:1.4em}
.joy{position:fixed;z-index:3;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;
  border:1.5px solid rgba(28,20,16,.6);background:rgba(239,224,187,.3);pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;background:rgba(28,20,16,.7)}
@media (max-width:640px){
  .intro{align-items:flex-end;background:linear-gradient(0deg,rgba(28,20,16,.92) 0%,rgba(28,20,16,.6) 45%,rgba(28,20,16,0) 80%)}
  .intro-in{margin-left:0}
  .intro h1{font-size:clamp(40px,7.5vh,64px)}
  .modes button{padding:8px 8px 8px 11px;font-size:13px}
  .hint{font-size:12px}
}
@media (prefers-reduced-motion:reduce){.intro,.hud,.place{transition:none}}

<body>
<canvas id="c" tabindex="0" aria-label="清明上河图三维画卷"></canvas>
<div class="bar t"></div><div class="bar b"></div>

<div class="hud" id="hud" hidden>
  <div class="sig"><span class="seal">清明上河图</span><p class="place" id="place"></p></div>
  <div class="ctl">
    <div class="modes"><button type="button" id="m-snd" aria-pressed="true" title="配乐开关（M）">配乐</button></div>
    <div class="modes" role="group" aria-label="游览方式">
      <button type="button" id="m-tour" aria-pressed="true">巡游</button>
      <button type="button" id="m-walk" aria-pressed="false">步行</button>
      <button type="button" id="m-fly" aria-pressed="false">飞行</button>
    </div>
  </div>
  <p class="hint" id="hint"></p>
</div>

<div class="intro" id="intro">
  <div class="intro-in">
    <h1>清明上河图</h1>
    <div class="intro-side">
      <p class="by">北宋 · 张择端 · 汴京春日</p>
      <p class="lead">绢本上的东京汴梁，立了起来。从郊野柳岸出发，沿汴河到虹桥，过城门，入市井，随意走。入画后有筝箫配乐。</p>
      <div class="acts">
        <button type="button" class="go" id="b-walk" disabled>入画漫步</button>
        <button type="button" id="b-tour" disabled>随卷轴巡游</button>
      </div>
      <p class="load" id="load">展卷中…</p>
    </div>
  </div>
</div>
<div class="joy" id="joy" hidden><i></i></div>

<script src="assets/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),loadEl=$('load');
if(!window.THREE){loadEl.textContent='三维引擎没有载入，请检查网络后重新打开。';return;}
const T=THREE,PI=Math.PI;

/* ---------- 工具 ---------- */
let seed=20261111;
const R=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const rr=(a,b)=>a+R()*(b-a), pick=a=>a[Math.floor(R()*a.length)];
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const SM=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
const h2=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);};
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return(h2(xi,yi)*(1-u)+h2(xi+1,yi)*u)*(1-v)+(h2(xi,yi+1)*(1-u)+h2(xi+1,yi+1)*u)*v;}

const C={silk:0xd6ba88,g1:0xc4a571,g2:0xb6975f,road:0xd9c296,mud:0x8f7a55,grass:0x9aa268,fieldG:0x8f9d5e,fieldY:0xb9a262,
  stone:0xa3957a,woodD:0x45301f,woodM:0x7b583a,woodL:0xa98660,bridge:0x935638,bridgeD:0x7a432c,plaster:0xdccba4,plank:0xb0905f,
  tile:0x5e5c57,tileD:0x47453f,tileB:0x566068,thatch:0xad9050,thatchD:0x8c7340,cin:0xa23b29,cinD:0x7c3323,mal:0x5d7f5e,azu:0x44627c,
  cloth:0xe7dcc0,bark:0x3f2e20,willow:0x8d9c52,willow2:0x778a4a,leaf:0x6e8049,leaf2:0x86904f,wallE:0xb39a70,skin:0xd9b68e,ink:0x2a2019,
  sack:0xbfa77a,mat:0xb59b60};
const ROBES=[0xe2d6b8,0xe2d6b8,0xcdbf9c,0xcdbf9c,0x6f7f86,0x4d6274,0x8a6a4a,0x5e6b4e,0xa24a36,0x3c3a36,0xb9a67c];
const GOODS=[0xa23b29,0xe7dcc0,0x5d7f5e,0xad9050,0x7b583a,0x44627c,0xc9a45a];
const SIGNS=['新酒','小酒','香饮子','赵太丞家','刘家上色沉檀拣香','王家罗锦匹帛铺','久住王员外家','神课','看命','决疑','解',
  '杨家应症','刘三叔精装字画','李家输卖上','茶','饼','香','药','米','盐','酒','脚店','孙记','曹婆婆肉饼','正店','漆器','纸马'];

/* ---------- 地形与路 ---------- */
const WATER=-0.9;
const rc=x=>10*Math.sin(x*0.012);
const START={x:44,z:rc(44)-25.2};
function terrain(x,z){
  const bank=SM(19,28,Math.abs(z-rc(x)));
  let h=-3.4*(1-bank);
  const rural=SM(120,300,x)*0.6+SM(150,235,Math.abs(z));
  const edge=(1-SM(205,252,Math.abs(z+10)))*(1-SM(440,515,Math.abs(x)));
  h+=bank*rural*edge*Math.max(0,vnoise(x*0.02,z*0.02)-0.3)*6;
  return h;
}
const archY=z=>0.15+6.2*(1-(z/30)*(z/30));
function groundAt(x,z){let h=terrain(x,z);if(Math.abs(x)<5&&Math.abs(z)<30)h=Math.max(h,archY(z));return h;}
function mkPath(pts,w){const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  return{pts,cum,len:cum[cum.length-1],w};}
function pathAt(p,s,o){s=clamp(s,0,p.len);let i=1;while(i<p.pts.length-1&&p.cum[i]<s)i++;
  const a=p.pts[i-1],b=p.pts[i],L=p.cum[i]-p.cum[i-1],t=(s-p.cum[i-1])/L;
  o.x=a[0]+(b[0]-a[0])*t;o.z=a[1]+(b[1]-a[1])*t;o.tx=(b[0]-a[0])/L;o.tz=(b[1]-a[1])/L;return o;}
const tow=[];for(let x=260;x>=-170;x-=20)tow.push([x,rc(x)-27.5]);
const P={
  main:mkPath([[360,-84],[250,-74],[150,-78],[60,-70],[0,-72],[-100,-72],[-190,-72],[-360,-72]],12),
  bridge:mkPath([[0,-72],[0,-30],[0,30],[0,66]],10),
  south:mkPath([[330,76],[150,64],[0,66],[-150,70],[-340,64]],10),
  cross:mkPath([[-262,-230],[-262,-72],[-262,-42]],10),
  tow:mkPath(tow,4),
  rural:mkPath([[345,-83],[250,-74],[150,-78],[70,-71]],4),
  gate:mkPath([[-110,-72],[-335,-72]],4)
};
const ROADS=[P.main,P.bridge,P.south,P.cross,P.tow];
function roadD(x,z){let m=1e9;for(const p of ROADS){for(let i=1;i<p.pts.length;i++){const a=p.pts[i-1],b=p.pts[i],dx=b[0]-a[0],dz=b[1]-a[1];
  const t=clamp(((x-a[0])*dx+(z-a[1])*dz)/(dx*dx+dz*dz),0,1),d=Math.hypot(x-a[0]-dx*t,z-a[1]-dz*t)-p.w/2;if(d<m)m=d;}}return m;}

/* ---------- 渲染器 ---------- */
let renderer;
try{renderer=new T.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance'});}
catch(e){loadEl.textContent='此设备无法开启 WebGL，画卷展不开。';return;}
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color(C.silk);scene.fog=new T.Fog(C.silk,35,400);
const NEAR=0.3,FAR=900;
const camera=new T.PerspectiveCamera(40,1,NEAR,FAR);camera.rotation.order='YXZ';
scene.add(new T.HemisphereLight(0xfff1d6,0x8a7350,0.72));
const sun=new T.DirectionalLight(0xffe6c0,0.42);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=-110;sc.right=110;sc.top=110;sc.bottom=-110;sc.near=1;sc.far=320;
sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.35;scene.add(sun,sun.target);
const SUNOFF=new T.Vector3(70,100,45);

const timeU={value:0};
const matSolid=new T.MeshLambertMaterial({vertexColors:true});
const matBoat=new T.MeshLambertMaterial({vertexColors:true,side:T.DoubleSide});
const matLeaf=new T.MeshLambertMaterial({vertexColors:true,side:T.DoubleSide});
matLeaf.onBeforeCompile=s=>{s.uniforms.uTime=timeU;
  s.vertexShader='attribute float sway;\nuniform float uTime;\n'+s.vertexShader.replace('#include <begin_vertex>',
  '#include <begin_vertex>\nfloat ph=uTime*1.1+position.x*.35+position.z*.27;transformed.x+=sin(ph)*sway*.24;transformed.z+=cos(ph*.8)*sway*.17;');};

/* ---------- 几何合并器 ---------- */
const NM=new T.Matrix3(),COL=new T.Color(),TM=new T.Matrix4(),TQ=new T.Quaternion(),TE=new T.Euler(),TP=new T.Vector3(),TS=new T.Vector3(),
  V1=new T.Vector3(),V2=new T.Vector3(),YA=new T.Vector3(0,1,0);
function tm(x,y,z,sx,sy,sz,rx,ry,rz){TE.set(rx||0,ry||0,rz||0);TQ.setFromEuler(TE);return TM.compose(TP.set(x,y,z),TQ,TS.set(sx,sy,sz));}
class Builder{
  constructor(){this.p=[];this.n=[];this.c=[];this.s=[];this.st=[new T.Matrix4()];this.m=new T.Matrix4();}
  get base(){return this.st[this.st.length-1];}
  set(x,y,z,ry){this.st.length=1;this.st[0].makeRotationY(ry||0).setPosition(x,y,z);return this;}
  push(x,y,z,ry){const m=new T.Matrix4().makeRotationY(ry||0).setPosition(x,y,z);this.st.push(new T.Matrix4().multiplyMatrices(this.base,m));}
  pop(){this.st.pop();}
  tint(color,jit){COL.setHex(color);const j=1+(R()-.5)*2*jit;return[COL.r*j,COL.g*j,COL.b*j];}
  add(geo,lm,color,sway,jit){
    const e=this.m.multiplyMatrices(this.base,lm).elements;NM.getNormalMatrix(this.m);const k=NM.elements;
    const pa=geo.attributes.position.array,na=geo.attributes.normal.array,[r,g,bl]=this.tint(color,jit===undefined?.07:jit);sway=sway||0;
    const p=this.p,n=this.n,c=this.c,s=this.s;
    for(let i=0;i<pa.length;i+=3){const x=pa[i],y=pa[i+1],z=pa[i+2];
      p.push(e[0]*x+e[4]*y+e[8]*z+e[12],e[1]*x+e[5]*y+e[9]*z+e[13],e[2]*x+e[6]*y+e[10]*z+e[14]);
      const a=na[i],b=na[i+1],d=na[i+2];const nx=k[0]*a+k[3]*b+k[6]*d,ny=k[1]*a+k[4]*b+k[7]*d,nz=k[2]*a+k[5]*b+k[8]*d,l=Math.hypot(nx,ny,nz)||1;
      n.push(nx/l,ny/l,nz/l);c.push(r,g,bl);s.push(sway);}
  }
  quad(a,b,c,d,color,sa,sb,sc_,sd){
    const m=this.base,A=new T.Vector3(a[0],a[1],a[2]).applyMatrix4(m),B=new T.Vector3(b[0],b[1],b[2]).applyMatrix4(m),
      Cc=new T.Vector3(c[0],c[1],c[2]).applyMatrix4(m),D=new T.Vector3(d[0],d[1],d[2]).applyMatrix4(m);
    const nn=V1.subVectors(B,A).cross(V2.subVectors(Cc,A));if(nn.lengthSq()<1e-12)nn.set(0,1,0);nn.normalize();
    const col=this.tint(color,.07),vs=[A,B,Cc,A,Cc,D],ss=[sa||0,sb||0,sc_||0,sa||0,sc_||0,sd||0];
    for(let i=0;i<6;i++){this.p.push(vs[i].x,vs[i].y,vs[i].z);this.n.push(nn.x,nn.y,nn.z);this.c.push(col[0],col[1],col[2]);this.s.push(ss[i]);}
  }
  geometry(){const g=new T.BufferGeometry();
    g.setAttribute('position',new T.BufferAttribute(new Float32Array(this.p),3));
    g.setAttribute('normal',new T.BufferAttribute(new Float32Array(this.n),3));
    g.setAttribute('color',new T.BufferAttribute(new Float32Array(this.c),3));
    g.setAttribute('sway',new T.BufferAttribute(new Float32Array(this.s),1));
    this.p=this.n=this.c=this.s=null;return g;}
  mesh(mat){const m=new T.Mesh(this.geometry(),mat);m.castShadow=m.receiveShadow=true;return m;}
}
const ni=g=>g.index?g.toNonIndexed():g;
function roofGeo(r){const A=[-.5,0,-.5],B=[.5,0,-.5],Cc=[.5,0,.5],D=[-.5,0,.5],R1=[-r/2,1,0],R2=[r/2,1,0];
  const t=[D,Cc,R2,D,R2,R1,B,A,R1,B,R1,R2,Cc,B,R2,A,D,R1],g=new T.BufferGeometry();
  g.setAttribute('position',new T.BufferAttribute(new Float32Array(t.flat()),3));g.computeVertexNormals();return g;}
function trapGeo(k){const g=ni(new T.BoxGeometry(1,1,1)),p=g.attributes.position.array;for(let i=0;i<p.length;i+=3)if(p[i+1]>0)p[i+2]*=k;g.computeVertexNormals();return g;}
const G={
  box:ni(new T.BoxGeometry(1,1,1)),cyl:ni(new T.CylinderGeometry(.5,.5,1,8)),cone:ni(new T.ConeGeometry(.5,1,8)),
  robe:ni(new T.CylinderGeometry(.15,.3,1.25,6,1,true).translate(0,.625,0)),
  head:ni(new T.SphereGeometry(.15,6,4).translate(0,1.42,0)),
  hat:ni(new T.BoxGeometry(.2,.13,.22).translate(0,1.585,-.02)),
  blob:ni(new T.IcosahedronGeometry(1,0)),
  gable:roofGeo(1),hip:roofGeo(.45),pyr:roofGeo(0),trap:trapGeo(.8),
  wheel:ni(new T.CylinderGeometry(.5,.5,1,12).rotateZ(PI/2))
};

const NOISE_GLSL=`float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}

function buildWater(){
  const mat=new T.ShaderMaterial({fog:true,uniforms:T.UniformsUtils.merge([T.UniformsLib.fog,{time:{value:0}}]),

    fragmentShader:`precision highp float;uniform float time;varying vec3 vW;\n#include <fog_pars_fragment>\n${NOISE_GLSL}

base*=1.-.28*smoothstep(8.,2.,abs(p.x))*smoothstep(28.,20.,abs(p.y));

  const m=new T.Mesh(new T.PlaneGeometry(1100,140),mat);m.rotation.x=-PI/2;m.position.y=WATER;scene.add(m);return mat;
}

  const rev=ctx.createConvolver();rev.buffer=ir;const wet=ctx.createGain();wet.gain.value=.34;
  MUS.bus=ctx.createGain();MUS.bus.connect(MUS.out);MUS.bus.connect(rev);rev.connect(wet);wet.connect(MUS.out);
  const pw=a=>ctx.createPeriodicWave(new Float32Array([0].concat(a)),new Float32Array(a.length+1));
  MUS.wP=pw([1,.55,.38,.2,.13,.08,.05,.03]);MUS.wX=pw([1,.22,.09,.03]);
  const nb=ctx.createBuffer(1,sr*2,sr),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;MUS.noise=nb;
  const ws=ctx.createBufferSource();ws.buffer=nb;ws.loop=true;const wf=ctx.createBiquadFilter();wf.type='lowpass';wf.frequency.value=520;
  MUS.water=ctx.createGain();MUS.water.gain.value=0;ws.connect(wf);wf.connect(MUS.water);MUS.water.connect(MUS.out);ws.start();
  if(!MUS.on)ctx.suspend();else if(ctx.state==='suspended')ctx.resume();
}
function pluck(t,n,v){const ctx=MUS.ctx,f=nf(n),o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
  o.setPeriodicWave(MUS.wP);o.frequency.setValueAtTime(f*1.014,t);o.frequency.exponentialRampToValueAtTime(f,t+.07);
  lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(9000,f*9),t);lp.frequency.exponentialRampToValueAtTime(f*1.6,t+1.4);
  const dec=f<200?3.2:2.3;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+dec);
  o.connect(lp);lp.connect(g);g.connect(MUS.bus);o.start(t);o.stop(t+dec+.05);}
function xiao(t,n,dur){const ctx=MUS.ctx,f=nf(n),o=ctx.createOscillator(),g=ctx.createGain(),lfo=ctx.createOscillator(),lg=ctx.createGain(),e=t+dur;
  o.setPeriodicWave(MUS.wX);o.frequency.setValueAtTime(f*.985,t);o.frequency.linearRampToValueAtTime(f,t+.09);
  lfo.frequency.value=5.1;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.007,t+Math.min(dur,.7));lfo.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.11);g.gain.setTargetAtTime(.15,t+.11,.3);g.gain.setTargetAtTime(0,e-.08,.09);
  const ns=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),ng=ctx.createGain();ns.buffer=MUS.noise;ns.loop=true;bp.type='bandpass';bp.frequency.value=f*2;bp.Q.value=3;
  ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(.05,t+.05);ng.gain.setTargetAtTime(.012,t+.08,.15);ng.gain.setTargetAtTime(0,e-.08,.08);
  ns.connect(bp);bp.connect(ng);ng.connect(MUS.bus);o.connect(g);g.connect(MUS.bus);
  o.start(t);lfo.start(t);ns.start(t,Math.random());o.stop(e+.6);lfo.stop(e+.6);ns.stop(e+.6);}
function audioTick(){const ctx=MUS.ctx;if(!ctx||ctx.state!=='running')return;
  if(MUS.next<ctx.currentTime)MUS.next=ctx.currentTime+.1;
  while(MUS.next<ctx.currentTime+.4){const t=MUS.next;
    for(const e of MUS.ev[MUS.step]){if(e.k==='x')xiao(t,e.n,e.d*SD*.96);else if(e.k==='p')pluck(t+Math.random()*.012,e.n,e.v);
      else for(let i=0;i<10;i++)pluck(t+i*.062,e.n+i,.13+i*.012);}
    MUS.next+=SD;MUS.step=(MUS.step+1)%STEPS;}
  const cp=camera.position,near=SM(75,12,Math.abs(cp.z-rc(cp.x)))*SM(60,6,cp.y);
  MUS.water.gain.setTargetAtTime(.012+.06*near,ctx.currentTime,.4);}
function toggleMusic(){MUS.on=!MUS.on;try{localStorage.setItem('qm-music',MUS.on?'1':'0');}catch(e){}
  $('m-snd').setAttribute('aria-pressed',String(MUS.on));if(!MUS.ctx){if(MUS.on)initAudio();return;}
  if(MUS.on)MUS.ctx.resume();else MUS.ctx.suspend();}

/* ---------- 展卷 ---------- */
function build(){
  buildTerrain();waterMat=buildWater();layout();
  for(let i=0;i<NCH;i++){if(chunks[i].p.length)scene.add(chunks[i].mesh(matSolid));if(fchunks[i].p.length)scene.add(fchunks[i].mesh(matLeaf));}
  buildWalkers();buildSigns();resize();
  curP.getPoint(tourU,camera.position);
  const hud=$('hud'),intro=$('intro');
  const begin=m=>{if(started)return;started=true;initAudio();intro.classList.add('out');hud.hidden=false;setTimeout(()=>{intro.hidden=true;},1100);mode='';setMode(m);cv.focus({preventScroll:true});};
  $('b-walk').disabled=$('b-tour').disabled=false;loadEl.textContent='';
  $('b-walk').addEventListener('click',()=>begin('walk'));$('b-tour').addEventListener('click',()=>begin('tour'));
  for(const k of['tour','walk','fly'])$('m-'+k).addEventListener('click',()=>{setMode(k);cv.focus({preventScroll:true});});
  $('m-snd').setAttribute('aria-pressed',String(MUS.on));$('m-snd').addEventListener('click',()=>{toggleMusic();cv.focus({preventScroll:true});});
  last=performance.now();requestAnimationFrame(frame);
}
setTimeout(()=>{try{build();}catch(e){console.error(e);loadEl.textContent='展卷时出了错：'+e.message;}},40);
})();
